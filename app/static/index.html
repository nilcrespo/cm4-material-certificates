<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="app.title">CM4 · Verificació de certificats de material</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/static/brand/favicon-64.png" />
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="/static/brand/cm4-logo-white.png" alt="CM4" onerror="this.parentElement.classList.add('no-logo'); this.remove()" />
      <span class="brand-fallback">CM4</span>
      <span data-i18n="brand.name"></span>
    </div>
    <nav class="view-tabs" role="tablist">
      <button type="button" role="tab" data-view="verify" data-i18n="tab.verify"></button>
      <button type="button" role="tab" data-view="history" data-i18n="tab.history"></button>
    </nav>
    <div class="bar-right">
      <span class="privacy" data-i18n="privacy.short"></span>
      <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang.label">
        <button type="button" data-lang="ca">CA</button><span aria-hidden="true">|</span><button type="button" data-lang="es">ES</button>
      </div>
    </div>
  </header>

  <!-- ===================== Verify ===================== -->
  <div id="view-verify" class="bench">
    <aside class="rail">
      <h2 class="eyebrow" data-i18n="rail.inputs"></h2>

      <form id="upload-form" novalidate>
        <div class="dz" id="dz-bom" data-kind="bom" tabindex="0">
          <input id="bom-input" type="file" accept=".xlsx,.csv" hidden />
          <div class="dz-head">
            <span class="dz-ico" aria-hidden="true">▦</span>
            <span class="dz-title" data-i18n="dz.bom.title"></span>
            <span class="dz-tag" data-i18n="badge.required"></span>
            <button type="button" class="dz-x" data-remove="bom" data-i18n-attr="title:dz.remove" hidden>✕</button>
          </div>
          <div class="dz-body" id="bom-body"></div>
        </div>

        <div class="dz" id="dz-certs" data-kind="certs" tabindex="0">
          <input id="certs-input" type="file" webkitdirectory multiple hidden />
          <div class="dz-head">
            <span class="dz-ico" aria-hidden="true">▤</span>
            <span class="dz-title" data-i18n="dz.certs.title"></span>
            <span class="dz-tag" data-i18n="badge.required"></span>
            <button type="button" class="dz-x" data-remove="certs" data-i18n-attr="title:dz.remove" hidden>✕</button>
          </div>
          <div class="dz-body" id="certs-body"></div>
        </div>

        <div class="dz" id="dz-corr" data-kind="corr" tabindex="0">
          <input id="correspondence-input" type="file" accept=".xlsx,.csv" hidden />
          <div class="dz-head">
            <span class="dz-ico" aria-hidden="true">⇄</span>
            <span class="dz-title" data-i18n="dz.corr.title"></span>
            <span class="dz-tag" data-i18n="badge.optional"></span>
            <button type="button" class="dz-x" data-remove="corr" data-i18n-attr="title:dz.remove" hidden>✕</button>
          </div>
          <div class="dz-body" id="corr-body"></div>
        </div>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <button id="submit-btn" type="submit" class="btn btn-primary btn-block" data-i18n="btn.run"></button>
        <div class="progress" id="progress" hidden>
          <div class="track"><div class="fill" id="progress-fill"></div></div>
          <div class="progress-label"><span id="progress-stage"></span><span id="progress-count"></span></div>
        </div>
      </form>

      <div class="rail-foot small">
        <span class="muted" data-i18n="rail.saved_to"></span>
        <span class="mono" id="exports-dir"></span>
      </div>
    </aside>

    <section class="main">
      <!-- Before the first run -->
      <div id="empty-state" class="empty">
        <h1 data-i18n="empty.title"></h1>
        <ol>
          <li data-i18n="empty.step1"></li>
          <li data-i18n="empty.step2"></li>
          <li data-i18n="empty.step3"></li>
        </ol>
      </div>

      <!-- Results -->
      <div id="results" class="results" hidden>
        <div class="runhead">
          <div class="runhead-row">
            <h1 id="run-title"></h1>
            <span class="muted small" id="run-meta"></span>
            <a id="export-link" class="btn" href="#" data-i18n="export.btn"></a>
          </div>
          <div class="stack" id="run-stack"></div>
          <div class="stack-label small"><span id="run-resolved"></span><span class="muted" id="run-pending"></span></div>
          <p class="small" id="saved-note" hidden></p>
          <div class="status-tabs" id="status-tabs" role="tablist"></div>
        </div>
        <div class="toolbar">
          <input id="results-search" class="search" type="search" data-i18n-attr="placeholder:history.search_placeholder" />
          <span class="kbd-hint small muted">
            <span data-i18n="kbd.hint"></span>
            <span class="kbd">J</span>/<span class="kbd">K</span> <span data-i18n="kbd.nav"></span> ·
            <span class="kbd">O</span> OK · <span class="kbd">D</span> <span data-i18n="status.mismatch"></span>
          </span>
        </div>

        <div class="work" id="work">
          <div class="table-wrap">
            <table class="grid sortable" id="results-table">
              <thead><tr id="results-head"></tr></thead>
              <tbody id="results-body"></tbody>
            </table>
            <p class="no-rows muted" id="no-rows" hidden data-i18n="no_rows"></p>
            <div id="orphans" class="orphans" hidden>
              <h2 data-i18n="orphans.title"></h2>
              <p class="muted small" data-i18n="orphans.hint"></p>
              <ul id="orphans-list" class="mono-list"></ul>
            </div>
          </div>

          <aside class="review" id="review" hidden>
            <div class="rv-head">
              <span class="rv-ref mono" id="rv-ref"></span>
              <span class="small muted" id="rv-pos"></span>
              <div class="rv-nav">
                <button type="button" class="btn btn-icon" id="rv-prev" data-i18n-attr="title:review.prev">↑</button>
                <button type="button" class="btn btn-icon" id="rv-next" data-i18n-attr="title:review.next">↓</button>
                <button type="button" class="btn btn-icon" id="rv-close" data-i18n-attr="title:review.close_key">✕</button>
              </div>
            </div>
            <div class="rv-body" id="rv-body"></div>
            <div class="rv-actions" id="rv-actions"></div>
          </aside>
        </div>
      </div>
    </section>
  </div>

  <!-- ===================== History ===================== -->
  <div id="view-history" class="page" hidden>
    <div class="page-head">
      <div>
        <h1 data-i18n="history.heading"></h1>
        <p class="muted small" data-i18n="history.lead"></p>
      </div>
      <button type="button" class="btn" id="history-refresh" data-i18n="history.refresh"></button>
    </div>
    <div class="history-tools">
      <input id="history-search" class="search" type="search" data-i18n-attr="placeholder:history.search_placeholder" />
      <span class="small"><span class="muted" data-i18n="history.folder"></span> <span class="mono" id="history-folder"></span></span>
    </div>
    <p id="history-status" class="muted small"></p>
    <div id="history-list" class="history-list"></div>
    <p id="history-ignored" class="muted small" hidden></p>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
